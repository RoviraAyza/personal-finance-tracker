[project]
name = "personal-finance-tracker"
version = "0.1.0"
description = "Categorise and report household spending from bank exports"
requires-python = ">=3.12"
dependencies = [
    "xlrd==2.0.1",          # reads legacy BIFF8 .xls (the bank's format)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "xlwt>=1.3",            # writes .xls, for synthetic test fixtures only
]

[project.scripts]
pf = "pf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "realdata: needs a real bank export; set PF_REAL_XLS to run",
]
